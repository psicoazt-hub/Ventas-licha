<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas Licha - Sistema de Gestión</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div id="app-container">
        <div id="vista-identidad" class="seccion hidden">
            <h2>SISTEMA LICHA</h2>
            <p>Nombre del responsable del equipo:</p>
            <input type="text" id="nombre-empleado-config" placeholder="Tu Nombre">
            <button onclick="configurarIdentidad()" class="btn-reg">CONFIGURAR APP</button>
            <p class="creditos">By Antonio Zavala Tolentino</p>
        </div>

        <div id="vista-principal" class="seccion hidden">
            <h2 id="txt-saludo"></h2>
            <div id="status-dia">
                <button id="btn-entrada" onclick="checarEntrada()" class="btn-carga">INICIAR DÍA (ENTRADA)</button>
            </div>
            <p class="creditos">By Antonio Zavala Tolentino</p>
        </div>

        <div id="vista-ventas" class="seccion hidden">
            <div class="header">
                <span id="info-user"></span>
                <button onclick="confirmarSalida()" class="btn-del">SALIDA / CORTE</button>
            </div>

            <div class="card">
                <h3>📦 CARGAR INVENTARIO</h3>
                <select id="tipo-prod-carga">
                    <option value="Harina">Harina (Normal)</option>
                    <option value="Taco">Tortilla Taco</option>
                    <option value="Trigo">Tortilla Trigo</option>
                    <option value="Burro">Mega Burro</option>
                </select>
                <select id="tamano-carga">
                    <option value="0.5">Paquete de 1/2 kg</option>
                    <option value="1">Paquete de 1 kg</option>
                </select>
                <input type="number" id="cant-carga" placeholder="Cantidad de Paquetes">
                <button onclick="cargarStock()" class="btn-reg">CARGAR A CAMIONETA</button>
            </div>

            <div id="monitor-stock" class="monitor"></div>

            <div class="card">
                <h3>💰 REGISTRAR VENTA</h3>
                <select id="prod-venta" onchange="actualizarInterfazVenta()"></select>
                <div class="flex" id="opciones-tamano-venta">
                    </div>
                <div class="flex">
                    <label><input type="radio" name="modo-venta" value="paq" checked onchange="calcularCobro()"> Venta por Paquete</label>
                    <label><input type="radio" name="modo-venta" value="kg" onchange="calcularCobro()"> Venta por Kilo</label>
                </div>
                <input type="number" id="cant-venta" placeholder="Cantidad" oninput="calcularCobro()">
                <input type="number" id="precio-venta" placeholder="Precio Unitario ($)" oninput="calcularCobro()">
                <input type="text" id="tienda-venta" placeholder="Nombre de Tienda / Rancho">
                
                <div id="previo-cobro" class="monitor" style="color: #ffcc00; border: 1px solid #ffcc00;">
                    TOTAL A COBRAR: $0.00
                </div>

                <div class="flex">
                    <button onclick="registrarVenta()" class="btn-primary">CONFIRMAR VENTA</button>
                    <button onclick="limpiarFormVenta()" class="btn-del">BORRAR</button>
                </div>
            </div>

            <div class="card">
                <button onclick="borrarUltimaVenta()" style="background: #555; color: white;">ANULAR ÚLTIMA VENTA</button>
            </div>

            <div id="historial-ventas"></div>
            <p class="creditos">By Antonio Zavala Tolentino</p>
        </div>
    </div>
    <script src="aplicacion.js"></script>
</body>
</html>
